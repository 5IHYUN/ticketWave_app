services:
  mysql:
    image: mysql:8.4   # AWS dev RDS(MySQL 8.4 LTS)와 동일 버전, 8.0은 RDS 표준 지원 종료
    container_name: team5-ticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing
      MYSQL_PASSWORD: ticketing1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: team5-ticket-redis
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.7
    container_name: team5-ticket-localstack
    environment:
      SERVICES: sqs,s3
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test-access-key
      AWS_SECRET_ACCESS_KEY: test-secret-key
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues --region ap-northeast-2 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team5-ticket-app
    environment:
      SPRING_PROFILES_ACTIVE: docker,worker
      SPRING_CLOUD_AWS_REGION_STATIC: ap-northeast-2

      JWT_SECRET: local-test-jwt-secret-key-at-least-32-characters-long
      JWT_EXPIRATION_MS: 3600000

      # 대기열 설정 (산정 근거는 application.yml queue 항목 참고)
      QUEUE_MAX_ACTIVE_USERS: 10000
      QUEUE_PROMOTION_BATCH_SIZE: 34
      QUEUE_PROMOTION_INTERVAL_MS: 1000
      QUEUE_TOKEN_TTL_SECONDS: 300
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

  # ===== 관측 스택 (로컬) =====
  # 로그: app stdout(JSON) → Alloy → Loki
  # 메트릭: app /actuator/prometheus → Prometheus
  # 조회: Grafana (http://localhost:3000, 로컬 전용 익명 관리자)
  loki:
    image: grafana/loki:3.4.2
    container_name: team5-ticket-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.7.1
    container_name: team5-ticket-alloy
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "12345:12345"                 # Alloy UI (수집 파이프라인 상태 확인)
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: team5-ticket-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      # 알림 규칙: config 저장소 원본에서 추출 (ticketWave_config에서 ./scripts/extract-rules.sh 먼저 실행)
      - ${CONFIG_REPO_DIR:-../ticketWave_config}/build/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.5.2
    container_name: team5-ticket-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # 대시보드: config 저장소 원본 (클러스터와 같은 JSON)
      - ${CONFIG_REPO_DIR:-../ticketWave_config}/infra/monitoring:/var/lib/grafana/dashboards/config:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus

volumes:
  mysql-data:
  redis-data:
  localstack-data:
  loki-data:
  prometheus-data:
  grafana-data:
