services:
  mysql:
    image: mysql:8.0
    container_name: team5-ticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing
      MYSQL_PASSWORD: ticketing1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: team5-ticket-redis
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.7
    container_name: team5-ticket-localstack
    environment:
      SERVICES: sqs,s3
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test-access-key
      AWS_SECRET_ACCESS_KEY: test-secret-key
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues --region ap-northeast-2 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team5-ticket-app
    environment:
      SPRING_PROFILES_ACTIVE: docker,worker
      SPRING_CLOUD_AWS_REGION_STATIC: ap-northeast-2

      JWT_SECRET: local-test-jwt-secret-key-at-least-32-characters-long
      JWT_EXPIRATION_MS: 3600000

      # 대기열 설정 (산정 근거는 application.yml queue 항목 참고)
      QUEUE_MAX_ACTIVE_USERS: 10000
      QUEUE_PROMOTION_BATCH_SIZE: 34
      QUEUE_PROMOTION_INTERVAL_MS: 1000
      QUEUE_TOKEN_TTL_SECONDS: 300
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  localstack-data:
