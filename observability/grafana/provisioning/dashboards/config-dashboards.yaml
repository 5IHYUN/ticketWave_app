# config 저장소 대시보드 로드 (클러스터와 같은 JSON 원본 사용, app에 사본 커밋 안 함)
#   마운트: docker-compose.yml grafana 볼륨 ${CONFIG_REPO_DIR:-../ticketWave_config}/infra/monitoring
apiVersion: 1
providers:
  - name: ticketwave-config
    folder: ticketWave_config
    type: file
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/config
