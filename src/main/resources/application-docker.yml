# docker 프로필: docker-compose로 전체(app + MySQL/Redis/LocalStack) 실행
# 호스트명은 compose 서비스 이름 기준
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/ticketing?useUnicode=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ticketing
    password: ticketing1234           # 로컬 compose 전용 계정

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    aws:
      sqs:
        enabled: true
        endpoint: http://localstack:4566
      region:
        static: ap-northeast-2
      s3:
        endpoint: http://localstack:4566
        path-style-access-enabled: true
      credentials:                    # LocalStack 더미 자격 증명
        access-key: test-access-key
        secret-key: test-secret-key
